schema_version: "vyges-upstream-v1"
upstream:
  # pdk_mirror: a whole-repo PDK mirror. The upstream tree is copied verbatim, so there is
  # no `import:` section -- the schema FORBIDS one for this type, because a selective import
  # here would describe something the sync workflow never does.
  type: "pdk_mirror"
  repo: https://github.com/azadnaeemi/GT2N
  # Upstream carries no release tags, so `branch` records where the pin came from and
  # `commit` IS the pin. It must agree with gt2n.vyges-pdk.json's `upstream.ref`.
  branch: main
  commit: fe179cb2aa424f93a2199a78bbbbed26c738f79c
license:
  spdx: BSD-3-Clause
  file: LICENSE
# Auto-synced daily by .github/workflows/upstream-sync.yml (merge-based). Vyges additions
# are preserved: gt2n.vyges-pdk.json (PDK descriptor), upstream.yaml, VYGES-MIRROR.md,
# and .github/workflows/ (pinned by the sync job).
metadata_locked: true
